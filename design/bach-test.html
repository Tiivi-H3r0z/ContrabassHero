<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bach Engine Test</title>
<style>
  :root { --bg: #07060d; --panel: #12101c; --line: #2a2540; --txt: #ece8ff; --dim: #8d86a8; --acc: #ff2d6f; --acc2: #00ffd5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.4 system-ui, sans-serif; padding: 20px 16px 40px; }
  main { max-width: 920px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  h1 span { color: var(--acc); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .track { text-align: left; background: #1a1628; color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .track b { display: block; font-size: 15px; }
  .track small { color: var(--dim); display: block; margin-top: 4px; }
  .track i { font-style: normal; color: var(--acc2); font-size: 12px; }
  .track.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { color: var(--dim); }
  input[type=range] { width: 220px; accent-color: var(--acc); }
  button.sm { background: #1a1628; color: var(--txt); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button.sm:hover, .track:hover { border-color: var(--acc2); }
  #lvl { font-weight: 700; color: var(--acc); min-width: 120px; display: inline-block; }
  canvas { width: 100%; height: 180px; display: block; background: #05040a; border-radius: 8px; }
  .stats { display: flex; gap: 18px; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 8px; }
  .stats b { color: var(--txt); }
  #beat { display: inline-flex; gap: 6px; }
  #beat span { width: 14px; height: 14px; border-radius: 50%; background: #2a2540; }
  #beat span.on { background: var(--acc2); }
</style>
</head>
<body>
<main>
  <h1>Bach <span>trash</span> engine</h1>
  <section class="panel">
    <div class="tracks" id="tracks"></div>
  </section>
  <section class="panel row">
    <label for="int">Intensité</label>
    <input id="int" type="range" min="0" max="6" step="1" value="2">
    <span id="lvl"></span>
    <label for="vol">Volume</label>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
    <button class="sm" id="stop">Stop</button>
  </section>
  <section class="panel row">
    <label>Stingers</label>
    <button class="sm" data-sting="finale">Finale</button>
    <button class="sm" data-sting="boss">Boss</button>
    <button class="sm" data-sting="death">Mort</button>
    <button class="sm" data-sting="carnage">Carnage</button>
  </section>
  <section class="panel">
    <canvas id="scope" width="1800" height="360"></canvas>
    <div class="stats">
      <span>Mesure <b id="bar">-</b></span>
      <span id="beat"><span></span><span></span><span></span><span></span></span>
      <span>Crête <b id="peak">-</b></span>
      <span>RMS <b id="rms">-</b></span>
      <span>Écrêtage <b id="clip">0</b></span>
    </div>
  </section>
</main>
<script type="module" src="./bach-test.ts"></script>
</body>
</html>
